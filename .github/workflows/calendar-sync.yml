name: Refresh parent calendar cards
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/calendar-sync.yml'
      - 'sync_calendar.py'
      - 'index.html'
      - 'test_calendar.py'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: parent-calendar-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install calendar readers
        run: python -m pip install 'icalendar==6.3.2' 'recurring-ical-events==3.5.1'
      - name: Refresh public calendar and restore logo
        run: python sync_calendar.py
      - name: Save public data and school logo
        run: |
          git config user.name 'Nün Calendar Sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add calendar-data.json
          if test -f nun-logo.jpg; then git add nun-logo.jpg; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public Google Calendar data and school logo'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Install browser for interface checks
        if: github.event_name != 'schedule'
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Check search, logo, mobile layout and calendar cards
        if: github.event_name != 'schedule'
        run: python test_calendar.py
      - name: Save browser check screenshots
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: parent-calendar-browser-checks
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
